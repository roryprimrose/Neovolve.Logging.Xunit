name: CI

on:
  # Trigger the workflow on push or pull request,
  # for any branch or version tag
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: windows-latest

    steps:

    - name: Resolve project name
      shell: pwsh
      run: Add-Content -Path ${env:GITHUB_ENV} "`nprojectName=$(${env:GITHUB_REPOSITORY}.substring(${env:GITHUB_REPOSITORY}.IndexOf('/') + 1))" -Encoding utf8
      
    - name: Checkout
      uses: actions/checkout@v5.0.0
      with:
        fetch-depth: 0
   
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4.2.0
      with:
          versionSpec: '6.x'
    
    - name: Use GitVersion
      id: gitversion # step id used as reference for output values
      uses: gittools/actions/gitversion/execute@v4.2.0
      with:
        configFilePath: ./GitVersion.yml

    - name: Update project version
      uses: roryprimrose/set-vs-sdk-project-version@v1.0.6
      with:
        projectFilter: 'package.props'
        version: ${{ steps.gitversion.outputs.SemVer }}
        assemblyVersion: ${{ steps.gitversion.outputs.AssemblySemVer }}
        fileVersion: ${{ steps.gitversion.outputs.MajorMinorPatch }}
        informationalVersion: ${{ steps.gitversion.outputs.InformationalVersion }}  
        
    - name: Setup dotnet v8.x
      uses: actions/setup-dotnet@v5.0.0
      with:
        dotnet-version: '8.x' # SDK Version to use.
    
    - name: Setup dotnet v9.x
      uses: actions/setup-dotnet@v5.0.0
      with:
        dotnet-version: '9.x' # SDK Version to use.
    
    - name: Download snk file
      shell: pwsh
      run: |
        $snkFileContent = "${{ secrets.SNK_FILE }}"
        [System.IO.File]::WriteAllBytes("Neovolve.Logging.Xunit.snk", [System.Convert]::FromBase64String($snkFileContent))

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore
    
    - name: Test
      run: dotnet test -c Release --no-build --collect:"XPlat Code Coverage"

    - name: Generate coverage report
      # run: reportgenerator -reports:**/coverage.cobertura.xml -targetdir:Report -reporttypes:HtmlInline_AzurePipelines;Cobertura
      uses: danielpalme/ReportGenerator-GitHub-Action@5.4.18
      with:
        reports: "**/coverage*cobertura.xml"
        targetdir: "Report"
        reporttypes: "HtmlInline;Cobertura"
        tag: '${{ github.run_number }}_${{ github.run_id }}'
      # Don't run on fork or dependabot builds
      if: github.event_name == 'pull_request' && github.repository == github.event.pull_request.head.repo.full_name && github.actor != 'dependabot[bot]'

    - name: Publish coverage report
      uses: 5monkeys/cobertura-action@master
      with:
        path: Report/Cobertura.xml
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        minimum_coverage: 75
      # Don't run on fork or dependabot builds
      if: github.event_name == 'pull_request' && github.repository == github.event.pull_request.head.repo.full_name && github.actor != 'dependabot[bot]'
      
    - name: Pack
      run: dotnet pack -c Release --no-build --include-symbols -o "${{ github.workspace }}/staging"

    - name: Publish build artifacts
      uses: actions/upload-artifact@v5.0.0
      with:
        name: packages
        path: "${{ github.workspace }}/staging"
    
    - shell: bash
      name: Write version
      run: |
        echo '${{ steps.gitversion.outputs.SemVer }}' > "${{ github.workspace }}/version.txt"
    - name: Upload version
      uses: actions/upload-artifact@v5.0.0
      with:
        name: version
        path: "${{ github.workspace }}/version.txt"

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Only run on pushes which should only be on the base repository
    if: (github.event_name == 'push' || github.event_name == 'pull_request') && github.actor != 'dependabot[bot]'
    
    steps:   

    - name: Resolve project name
      shell: pwsh
      run: Add-Content -Path ${env:GITHUB_ENV} "`nprojectName=$(${env:GITHUB_REPOSITORY}.substring(${env:GITHUB_REPOSITORY}.IndexOf('/') + 1))" -Encoding utf8
      
    - name: Setup dotnet v9.x
      uses: actions/setup-dotnet@v5.0.0
      with:
        dotnet-version: '9.x' # SDK Version to use.
    
    - name: Download packages
      uses: actions/download-artifact@v6.0.0
      with:
        name: packages
      
    - name: Download version
      uses: actions/download-artifact@v6.0.0
      with:
        name: version

    - name: Read version
      shell: bash
      run: |
        value=`cat version.txt`
        echo SemVer=$(echo $value) >> $GITHUB_ENV 
    
    - name: Publish package to MyGet.org
      env: 
        MYGET_APIKEY: ${{ secrets.MYGET_APIKEY }}
      run: dotnet nuget push ${{ env.projectName }}.v3.${{ env.SemVer }}.symbols.nupkg --api-key $MYGET_APIKEY --source https://www.myget.org/F/neovolve/api/v2/package
      
    - name: Publish signed package to MyGet.org
      env: 
        MYGET_APIKEY: ${{ secrets.MYGET_APIKEY }}
      run: dotnet nuget push ${{ env.projectName }}.Signed.v3.${{ env.SemVer }}.symbols.nupkg --api-key $MYGET_APIKEY --source https://www.myget.org/F/neovolve/api/v2/package
      
  release:
    needs: build
    runs-on: ubuntu-latest
    # Only run on pushes which should only be on the base repository and only where the branch is main or is a version tagged build
    if: (github.event_name == 'push' || github.event_name == 'pull_request') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.actor != 'dependabot[bot]'

    steps:
    
    - name: Resolve project name
      shell: pwsh
      run: Add-Content -Path ${env:GITHUB_ENV} "`nprojectName=$(${env:GITHUB_REPOSITORY}.substring(${env:GITHUB_REPOSITORY}.IndexOf('/') + 1))" -Encoding utf8
      
    - name: Setup dotnet v9.x
      uses: actions/setup-dotnet@v5.0.0
      with:
        dotnet-version: '9.x' # SDK Version to use.
    
    - name: Download packages
      uses: actions/download-artifact@v6.0.0
      with:
        name: packages
      
    - name: Download version
      uses: actions/download-artifact@v6.0.0
      with:
        name: version

    - name: Read version
      shell: bash
      run: |
        value=`cat version.txt`
        echo SemVer=$(echo $value) >> $GITHUB_ENV 
    
    - name: Publish package to GitHub
      run: dotnet nuget push ${{ env.projectName }}.v3.${{ env.SemVer }}.symbols.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source "https://nuget.pkg.github.com/roryprimrose/index.json"

    - name: Publish signed package to GitHub
      run: dotnet nuget push ${{ env.projectName }}.Signed.v3.${{ env.SemVer }}.symbols.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source "https://nuget.pkg.github.com/roryprimrose/index.json"

    - name: Publish package to NuGet.org
      env: 
        NUGET_APIKEY: ${{ secrets.NUGET_APIKEY }}
      run: dotnet nuget push ${{ env.projectName }}.v3.${{ env.SemVer }}.symbols.nupkg --api-key $NUGET_APIKEY --source https://api.nuget.org/v3/index.json

    - name: Publish signed package to NuGet.org
      env: 
        NUGET_APIKEY: ${{ secrets.NUGET_APIKEY }}
      run: dotnet nuget push ${{ env.projectName }}.Signed.v3.${{ env.SemVer }}.symbols.nupkg --api-key $NUGET_APIKEY --source https://api.nuget.org/v3/index.json

    - name: Create release
      uses: softprops/action-gh-release@v2.5.0
      with:
        tag_name: ${{ env.SemVer }}
        name: Release ${{ env.SemVer }}
        draft: false
        prerelease: ${{ contains(env.SemVer, 'beta') }}
        files: |
          ${{ env.projectName }}.v3.${{ env.SemVer }}.nupkg
          ${{ env.projectName }}.v3.${{ env.SemVer }}.symbols.nupkg
          ${{ env.projectName }}.Signed.v3.${{ env.SemVer }}.nupkg
          ${{ env.projectName }}.Signed.v3.${{ env.SemVer }}.symbols.nupkg